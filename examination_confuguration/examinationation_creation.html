<!DOCTYPE html>
<html>
<head>
    <title>Examination configuration</title>
</head>
<body>

<div class="exam-box">
    <h2>Add new examination</h2>
    <hr>

    <form>
        <div class="input-group">
            <label>Examination Name:</label>
            <input type="text" placeholder="Enter examination name">
        </div><br>

        <div class="input-group">
            <label>Examination code:</label>
            <input type="number" placeholder="Enter Examination code">
        </div><br><br>

        <button type="submit">Create a record</button>
        <button type="submit">Cancel</button>

    </form>
</div>

</body>
</html>
