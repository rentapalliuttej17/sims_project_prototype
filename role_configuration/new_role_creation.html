<!DOCTYPE html>
<html>
<head>
    <title>Role creation</title>
</head>
<body>

<div class="creat-box">
    <h2>New role details</h2>
    <hr>
    <form>
        <div class="input-group">
            <label>Role name:</label>
            <input type="text" placeholder="Enter Role name">
        </div><br>

        <div class="input-group">
            <label>Role code:</label>
            <input type="number" placeholder="Enter Role code">
        </div><br>

        <div class="input-group">
            <label>Role Description:</label>
            <input type="text" placeholder="Role description">
        </div><br>
        <hr><br><br>


        <button type="submit">Create a record</button>
        <button type="submit">Cancel</button>

    </form>
</div>

</body><br><br><br>
<h4> Role creation </h4>
</html>
